<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Salons</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container">
        <h1>Accueil - Salons</h1>
        
        <div class="grid-sections">
            <!-- SECTION GAUCHE : REJOINDRE -->
            <div class="form-group section-join">
                <button type="button" class="btn-join">Rejoindre un salon</button>
                <input type="text" id="salonId" placeholder="ID du salon">
                <input type="text" id="pseudoJoin" placeholder="Pseudonyme">
            </div>

            <!-- SECTION DROITE : CRÉER -->
            <div class="form-group">
                <button type="button" class="btn-create">Créer un salon</button>
                <input type="text" id="pseudoCreate" placeholder="Pseudonyme">
            </div>
        </div>
    </div>

</body>
</html>
